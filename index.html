<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBF x 殺戮尖塔：空之塔戰記</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1e2638 0%, #0d111a 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 戰鬥舞台 */
        #arena {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .fighter {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            width: 260px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
        }

        .avatar {
            font-size: 64px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .intent-box {
            position: absolute;
            top: -35px;
            background: #e74c3c;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(231,76,60,0.8);
        }

        /* 條狀計量表 */
        .bar-container { width: 100%; margin: 6px 0; }
        .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
        .bar {
            width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden;
        }
        .hp-fill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.3s; }
        .charge-fill { height: 100%; background: #f39c12; width: 0%; transition: width 0.3s; }
        .block-text { color: #3498db; font-weight: bold; font-size: 14px; margin-top: 4px; }

        /* 中央戰鬥訊息與 Chain Burst 提示 */
        #msg-log {
            position: absolute;
            top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 2px 4px #000;
            text-align: center;
        }

        /* 召喚石區塊 */
        #summon-area {
            position: absolute;
            left: 20px;
            bottom: 240px;
        }
        .summon-btn {
            background: linear-gradient(135deg, #4b134f, #c94b4b);
            border: 2px solid #e056fd;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(224, 86, 253, 0.5);
            transition: transform 0.2s;
        }
        .summon-btn:disabled {
            background: #555;
            border-color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 玩家操作列與手牌 */
        #control-panel {
            background: rgba(10, 15, 25, 0.95);
            border-top: 2px solid #34495e;
            height: 230px;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .ap-badge {
            background: #e67e22;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        #hand-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex: 1;
            align-items: center;
        }

        /* 卡牌樣式 */
        .card {
            width: 120px;
            height: 160px;
            background: #2c3e50;
            border-radius: 8px;
            border: 2px solid #7f8c8d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-15px) scale(1.05);
            border-color: #f1c40f;
            z-index: 10;
        }
        .card.fire { border-color: #e74c3c; background: #3d1c1c; }
        .card.water { border-color: #3498db; background: #1c2a3d; }
        .card.ougi {
            border-color: #f1c40f;
            background: linear-gradient(135deg, #4a3b00, #801313);
            box-shadow: 0 0 15px #f1c40f;
        }
        .card-cost {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #e67e22;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            font-size: 12px;
        }
        .card-title { font-weight: bold; font-size: 13px; text-align: center; }
        .card-desc { font-size: 11px; color: #bdc3c7; text-align: center; }

        .end-turn-btn {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="arena">
        <div id="msg-log">戰鬥開始！擊敗星晶獸！</div>

        <!-- 召喚石 -->
        <div id="summon-area">
            <button id="summon-btn" class="summon-btn" onclick="useSummon()">召喚：巴哈姆特 (CD: 3)</button>
        </div>

        <!-- 玩家 -->
        <div class="fighter" id="player-box">
            <div class="avatar">🗡️</div>
            <h3>姬塔 / 格蘭</h3>
            <div class="bar-container">
                <div class="bar-label"><span>HP</span><span id="player-hp-text">80/80</span></div>
                <div class="bar"><div id="player-hp-bar" class="hp-fill"></div></div>
            </div>
            <div class="bar-container">
                <div class="bar-label"><span>奧義值</span><span id="player-charge-text">0%</span></div>
                <div class="bar"><div id="player-charge-bar" class="charge-fill"></div></div>
            </div>
            <div class="block-text">護盾: <span id="player-block">0</span></div>
        </div>

        <!-- 敵人 -->
        <div class="fighter" id="enemy-box">
            <div id="enemy-intent" class="intent-box">意圖: 攻擊 10</div>
            <div class="avatar">🐉</div>
            <h3>星晶獸 · 提亞瑪特</h3>
            <div class="bar-container">
                <div class="bar-label"><span>HP</span><span id="enemy-hp-text">120/120</span></div>
                <div class="bar"><div id="enemy-hp-bar" class="hp-fill" style="background:#e74c3c;"></div></div>
            </div>
            <div class="block-text">護盾: <span id="enemy-block">0</span></div>
        </div>
    </div>

    <!-- 玩家操作區 -->
    <div id="control-panel">
        <div id="stats-bar">
            <div>
                <span class="ap-badge">AP: <span id="player-ap">3</span>/3</span>
                <span style="margin-left: 15px;">抽牌堆: <span id="deck-count">0</span> | 棄牌堆: <span id="discard-count">0</span></span>
            </div>
            <div>
                <span id="chain-burst-indicator" style="color: #e67e22; font-weight: bold; margin-right: 15px;"></span>
                <button class="end-turn-btn" onclick="endTurn()">結束回合</button>
            </div>
        </div>
        <div id="hand-area"></div>
    </div>

    <script>
        // 戰鬥狀態
        const state = {
            player: { maxHp: 80, hp: 80, ap: 3, maxAp: 3, block: 0, charge: 0 },
            enemy: { maxHp: 120, hp: 120, block: 0, nextAction: 'attack', nextVal: 10 },
            deck: [],
            hand: [],
            discard: [],
            summonCd: 0,
            chainCount: 0, // 本回合連續相同屬性計數
            lastElement: null
        };

        // 牌庫範本
        const CARD_TYPES = [
            { id: 1, name: "紅蓮斬", element: "fire", cost: 1, dmg: 8, block: 0, charge: 15, desc: "火屬性 8 傷，+15% 奧義" },
            { id: 2, name: "炎之壁", element: "fire", cost: 1, dmg: 0, block: 8, charge: 10, desc: "火屬性 8 盾，+10% 奧義" },
            { id: 3, name: "激流刺", element: "water", cost: 1, dmg: 7, block: 0, charge: 20, desc: "水屬性 7 傷，+20% 奧義" },
            { id: 4, name: "水之護符", element: "water", cost: 1, dmg: 0, block: 10, charge: 5, desc: "水屬性 10 盾" },
            { id: 5, name: "劍氣蓄力", element: "none", cost: 0, dmg: 0, block: 0, charge: 25, desc: "0費 獲得 25% 奧義" }
        ];

        // 初始牌庫建構 (10張)
        function initDeck() {
            state.deck = [
                {...CARD_TYPES[0]}, {...CARD_TYPES[0]}, {...CARD_TYPES[0]},
                {...CARD_TYPES[1]}, {...CARD_TYPES[1]},
                {...CARD_TYPES[2]}, {...CARD_TYPES[2]},
                {...CARD_TYPES[3]},
                {...CARD_TYPES[4]}, {...CARD_TYPES[4]}
            ];
            shuffle(state.deck);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function log(msg) {
            document.getElementById('msg-log').innerText = msg;
        }

        // 開始玩家回合
        function startPlayerTurn() {
            state.player.ap = state.player.maxAp;
            state.player.block = 0;
            state.chainCount = 0;
            state.lastElement = null;

            // 抽 4 張牌
            drawCards(4);

            // 檢查奧義是否滿 100% -> 給予免費奧義卡
            if (state.player.charge >= 100) {
                state.hand.push({
                    id: 99,
                    name: "【奧義】極致斬擊",
                    element: "ougi",
                    cost: 0,
                    dmg: 35,
                    block: 0,
                    charge: 0,
                    desc: "消耗 100% 奧義造成 35 點爆發傷害！"
                });
                log("奧義已滿！釋放奧義之刻已到！");
            }

            // 更新召喚石 CD
            if (state.summonCd > 0) state.summonCd--;

            decideEnemyIntent();
            updateUI();
        }

        function drawCards(count) {
            for (let i = 0; i < count; i++) {
                if (state.deck.length === 0) {
                    if (state.discard.length === 0) break;
                    state.deck = [...state.discard];
                    state.discard = [];
                    shuffle(state.deck);
                }
                state.hand.push(state.deck.pop());
            }
        }

        // 打出卡牌
        function playCard(index) {
            const card = state.hand[index];
            if (state.player.ap < card.cost) {
                log("AP 不足！無法出牌！");
                return;
            }

            state.player.ap -= card.cost;

            // 傷害結算
            if (card.dmg > 0) {
                dealDamageToEnemy(card.dmg);
            }

            // 護盾結算
            if (card.block > 0) {
                state.player.block += card.block;
            }

            // 奧義值處理
            if (card.element === 'ougi') {
                state.player.charge = 0;
            } else {
                state.player.charge = Math.min(100, state.player.charge + card.charge);
            }

            // 碧藍幻想特色：屬性 Chain Burst 連段判定
            if (card.element !== 'none' && card.element !== 'ougi') {
                if (state.lastElement === card.element) {
                    state.chainCount++;
                    if (state.chainCount >= 2) {
                        const burstDmg = 12;
                        log(`觸發 【Chain Burst: ${card.element.toUpperCase()}】！追擊 ${burstDmg} 點傷害！`);
                        dealDamageToEnemy(burstDmg);
                        state.chainCount = 0; // 重置
                    }
                } else {
                    state.lastElement = card.element;
                    state.chainCount = 1;
                }
            }

            // 移除手牌並送入棄牌堆（奧義卡用完消失）
            state.hand.splice(index, 1);
            if (card.element !== 'ougi') {
                state.discard.push(card);
            }

            checkVictory();
            updateUI();
        }

        function dealDamageToEnemy(dmg) {
            let remain = dmg;
            if (state.enemy.block > 0) {
                if (state.enemy.block >= remain) {
                    state.enemy.block -= remain;
                    remain = 0;
                } else {
                    remain -= state.enemy.block;
                    state.enemy.block = 0;
                }
            }
            state.enemy.hp = Math.max(0, state.enemy.hp - remain);
        }

        // 召喚石技能
        function useSummon() {
            if (state.summonCd > 0) return;
            log("巴哈姆特降臨：終焉之刻！造成 25 點全體穿甲重創，AP+1！");
            state.enemy.hp = Math.max(0, state.enemy.hp - 25);
            state.player.ap += 1;
            state.summonCd = 4; // 進入冷卻
            checkVictory();
            updateUI();
        }

        // 結束回合與敵人 AI 行動
        function endTurn() {
            // 丟棄手牌
            while (state.hand.length > 0) {
                const c = state.hand.pop();
                if (c.element !== 'ougi') state.discard.push(c);
            }

            // 敵人行動
            state.enemy.block = 0;
            setTimeout(() => {
                if (state.enemy.nextAction === 'attack') {
                    let dmg = state.enemy.nextVal;
                    if (state.player.block >= dmg) {
                        state.player.block -= dmg;
                    } else {
                        dmg -= state.player.block;
                        state.player.block = 0;
                        state.player.hp = Math.max(0, state.player.hp - dmg);
                    }
                    log(`敵人發動攻擊，造成 ${state.enemy.nextVal} 傷害！`);
                } else {
                    state.enemy.block += state.enemy.nextVal;
                    log(`敵人凝聚風暴壁障，獲得 ${state.enemy.nextVal} 點護盾！`);
                }

                if (state.player.hp <= 0) {
                    alert("騎空團全滅... 戰鬥失敗！");
                    location.reload();
                    return;
                }

                setTimeout(startPlayerTurn, 1000);
                updateUI();
            }, 600);
        }

        // 決定敵人下一次意圖
        function decideEnemyIntent() {
            const rand = Math.random();
            if (rand < 0.65) {
                state.enemy.nextAction = 'attack';
                state.enemy.nextVal = Math.floor(Math.random() * 6) + 8; // 8~13 傷
            } else {
                state.enemy.nextAction = 'defend';
                state.enemy.nextVal = 12; // 12 盾
            }
        }

        function checkVictory() {
            if (state.enemy.hp <= 0) {
                setTimeout(() => {
                    alert("VICTORY!! 成功擊敗星晶獸！");
                    location.reload();
                }, 100);
            }
        }

        // 渲染畫面
        function updateUI() {
            // 玩家狀態
            document.getElementById('player-hp-text').innerText = `${state.player.hp}/${state.player.maxHp}`;
            document.getElementById('player-hp-bar').style.width = `${(state.player.hp / state.player.maxHp) * 100}%`;
            document.getElementById('player-charge-text').innerText = `${state.player.charge}%`;
            document.getElementById('player-charge-bar').style.width = `${state.player.charge}%`;
            document.getElementById('player-block').innerText = state.player.block;
            document.getElementById('player-ap').innerText = state.player.ap;

            // 敵人狀態
            document.getElementById('enemy-hp-text').innerText = `${state.enemy.hp}/${state.enemy.maxHp}`;
            document.getElementById('enemy-hp-bar').style.width = `${(state.enemy.hp / state.enemy.maxHp) * 100}%`;
            document.getElementById('enemy-block').innerText = state.enemy.block;
            document.getElementById('enemy-intent').innerText = state.enemy.nextAction === 'attack'
                ? `意圖: 攻擊 ⚔️ ${state.enemy.nextVal}`
                : `意圖: 防禦 🛡️ ${state.enemy.nextVal}`;

            // 牌庫指示
            document.getElementById('deck-count').innerText = state.deck.length;
            document.getElementById('discard-count').innerText = state.discard.length;

            // 召喚石按鈕
            const summonBtn = document.getElementById('summon-btn');
            if (state.summonCd > 0) {
                summonBtn.innerText = `巴哈姆特 (CD: ${state.summonCd})`;
                summonBtn.disabled = true;
            } else {
                summonBtn.innerText = `召喚：巴哈姆特 (READY)`;
                summonBtn.disabled = false;
            }

            // 連擊提示
            const chainText = document.getElementById('chain-burst-indicator');
            chainText.innerText = state.lastElement ? `連鎖屬性: [${state.lastElement.toUpperCase()}] 連段中` : "";

            // 渲染手牌
            const handArea = document.getElementById('hand-area');
            handArea.innerHTML = '';
            state.hand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.element}`;
                cardEl.onclick = () => playCard(index);
                cardEl.innerHTML = `
                    <div class="card-cost">${card.cost}</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-desc">${card.desc}</div>
                    <div style="font-size:10px; text-align:right; color:#888;">${card.element.toUpperCase()}</div>
                `;
                handArea.appendChild(cardEl);
            });
        }

        // 啟動
        initDeck();
        startPlayerTurn();
    </script>
</body>
</html>
