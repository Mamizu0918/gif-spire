<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBF Slay the Spire Prototype</title>
    <style>
        body {
            background-color: #1a1e24;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        #battlefield {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }
        .entity {
            border: 2px solid #555;
            background: #2a2e39;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .bar-container {
            background: #444;
            height: 14px;
            border-radius: 7px;
            margin: 8px 0;
            overflow: hidden;
        }
        .hp-fill { background: #e74c3c; height: 100%; width: 100%; transition: width 0.3s; }
        .charge-fill { background: #f39c12; height: 100%; width: 0%; transition: width 0.3s; }
        #log {
            margin: 20px 0;
            height: 60px;
            font-size: 15px;
            color: #ffcc00;
            text-align: center;
        }
        #hand {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            min-height: 150px;
        }
        .card {
            background: #34495e;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 12px;
            width: 120px;
            height: 160px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #f1c40f;
        }
        .card.ultimate {
            background: #4a235a;
            border-color: #9b59b6;
        }
        .card-cost {
            font-weight: bold;
            color: #3498db;
        }
        .card-title {
            font-weight: bold;
            font-size: 15px;
            text-align: center;
        }
        .card-desc {
            font-size: 12px;
            color: #bdc3c7;
        }
        button.end-turn {
            margin-top: 25px;
            padding: 10px 25px;
            background: #27ae60;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.end-turn:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <h2>碧藍尖塔 (Granblue Spire) - Demo</h2>
    
    <div id="battlefield">
        <!-- 玩家 -->
        <div class="entity" id="player">
            <h3>古蘭 (Gran)</h3>
            <div>生命: <span id="player-hp">50</span>/50</div>
            <div class="bar-container"><div id="player-hp-bar" class="hp-fill"></div></div>
            <div>護甲: <span id="player-shield">0</span></div>
            <div>能量: <span id="player-ap">3</span>/3</div>
            <div style="margin-top: 10px;">奧義值: <span id="player-charge">0</span>%</div>
            <div class="bar-container"><div id="player-charge-bar" class="charge-fill"></div></div>
        </div>

        <!-- 敵人 -->
        <div class="entity" id="enemy">
            <h3>原型巴哈姆特</h3>
            <div>意圖: <span id="enemy-intent" style="color: #e67e22; font-weight: bold;">準備重擊 (10)</span></div>
            <div style="margin-top: 15px;">生命: <span id="enemy-hp">80</span>/80</div>
            <div class="bar-container"><div id="enemy-hp-bar" class="hp-fill"></div></div>
            <div>護甲: <span id="enemy-shield">0</span></div>
        </div>
    </div>

    <div id="log">輪到你的回合！點選卡牌發動攻擊或防禦。</div>
    <div id="hand"></div>
    <button class="end-turn" onclick="endTurn()">結束回合</button>

    <script>
        // 遊戲狀態資料
        const state = {
            turn: 1,
            player: { maxHp: 50, hp: 50, shield: 0, ap: 3, maxAp: 3, charge: 0 },
            enemy: { maxHp: 80, hp: 80, shield: 0, nextDamage: 10 },
            deck: [
                { name: "斬擊", cost: 1, type: "atk", value: 8, charge: 15, desc: "造成 8 傷害，累積 15% 奧義" },
                { name: "破慘炎舞", cost: 2, type: "atk", value: 18, charge: 25, desc: "造成 18 傷害，累積 25% 奧義" },
                { name: "全神貫注", cost: 1, type: "def", value: 8, charge: 10, desc: "獲得 8 護甲，累積 10% 奧義" },
                { name: "聖壁護持", cost: 2, type: "def", value: 16, charge: 15, desc: "獲得 16 護甲，累積 15% 奧義" },
            ],
            hand: []
        };

        function updateUI() {
            // 更新數值
            document.getElementById('player-hp').innerText = state.player.hp;
            document.getElementById('player-hp-bar').style.width = (state.player.hp / state.player.maxHp * 100) + '%';
            document.getElementById('player-shield').innerText = state.player.shield;
            document.getElementById('player-ap').innerText = state.player.ap;
            document.getElementById('player-charge').innerText = state.player.charge;
            document.getElementById('player-charge-bar').style.width = state.player.charge + '%';

            document.getElementById('enemy-hp').innerText = state.enemy.hp;
            document.getElementById('enemy-hp-bar').style.width = (state.enemy.hp / state.enemy.maxHp * 100) + '%';
            document.getElementById('enemy-shield').innerText = state.enemy.shield;
            document.getElementById('enemy-intent').innerText = `攻擊 (${state.enemy.nextDamage})`;

            // 渲染手牌
            const handContainer = document.getElementById('hand');
            handContainer.innerHTML = '';
            
            // 如果奧義條滿 100，額外加入奧義卡
            let currentCards = [...state.hand];
            if (state.player.charge >= 100) {
                currentCards.unshift({
                    name: "【奧義】災厄之破",
                    cost: 0,
                    type: "ultimate",
                    value: 35,
                    desc: "消耗 100% 奧義，造成 35 巨量傷害！"
                });
            }

            currentCards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.type === 'ultimate' ? 'ultimate' : ''}`;
                cardDiv.innerHTML = `
                    <div class="card-cost">${card.cost} AP</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-desc">${card.desc}</div>
                `;
                cardDiv.onclick = () => playCard(card, index);
                handContainer.appendChild(cardDiv);
            });
        }

        function playCard(card, index) {
            if (state.player.ap < card.cost) {
                document.getElementById('log').innerText = "行動點數 (AP) 不足！";
                return;
            }

            state.player.ap -= card.cost;

            if (card.type === "atk") {
                let damage = card.value;
                applyDamage(state.enemy, damage);
                state.player.charge = Math.min(100, state.player.charge + card.charge);
                document.getElementById('log').innerText = `你使用了 ${card.name}，造成了 ${damage} 點傷害！`;
                state.hand.splice(index, 1);
            } else if (card.type === "def") {
                state.player.shield += card.value;
                state.player.charge = Math.min(100, state.player.charge + card.charge);
                document.getElementById('log').innerText = `你使用了 ${card.name}，獲得了 ${card.value} 點護盾！`;
                state.hand.splice(index, 1);
            } else if (card.type === "ultimate") {
                state.player.charge = 0;
                applyDamage(state.enemy, card.value);
                document.getElementById('log').innerText = `奧義釋放！【災厄之破】重創敵人 ${card.value} 點傷害！`;
            }

            if (state.enemy.hp <= 0) {
                alert("勝利！你討伐了原型巴哈姆特！");
                location.reload();
                return;
            }

            updateUI();
        }

        function applyDamage(target, damage) {
            if (target.shield >= damage) {
                target.shield -= damage;
            } else {
                let rem = damage - target.shield;
                target.shield = 0;
                target.hp = Math.max(0, target.hp - rem);
            }
        }

        function drawCards(count = 4) {
            state.hand = [];
            for (let i = 0; i < count; i++) {
                const randomCard = state.deck[Math.floor(Math.random() * state.deck.length)];
                state.hand.push({ ...randomCard });
            }
        }

        function endTurn() {
            document.getElementById('log').innerText = "敵方行動中...";
            // 敵人攻擊
            let dmg = state.enemy.nextDamage;
            applyDamage(state.player, dmg);

            if (state.player.hp <= 0) {
                alert("你倒下了... 爬塔結束！");
                location.reload();
                return;
            }

            // 新回合重置
            state.player.ap = state.player.maxAp;
            state.player.shield = 0;
            state.enemy.shield = 0;
            state.enemy.nextDamage = Math.floor(Math.random() * 8) + 8; // 下回合隨機攻擊 8~15
            drawCards(4);
            document.getElementById('log').innerText = `敵方對你造成了傷害！輪到你的回合。`;
            updateUI();
        }

        // 初始化
        drawCards(4);
        updateUI();
    </script>
</body>
</html>
