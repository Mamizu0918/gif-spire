<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 繞過防盜連，確保圖片載入正常 -->
    <meta name="referrer" content="no-referrer">
    <title>碧藍尖塔 - ハロアズサ參戰</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1e2430 0%, #0d1117 100%);
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            min-height: 100vh;
        }

        h2 {
            margin: 5px 0 20px 0;
            letter-spacing: 2px;
            color: #c678dd;
            text-shadow: 0 0 10px rgba(198, 120, 221, 0.5);
        }

        #battlefield {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 860px;
        }

        .entity {
            border: 2px solid #3b4252;
            background: rgba(30, 36, 48, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 12px;
            width: 240px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 角色頭像/立繪容器 */
        .portrait-wrapper {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 3px solid #e5c07b;
            overflow: hidden;
            box-shadow: 0 0 14px rgba(229, 192, 123, 0.6);
            margin-bottom: 12px;
            background: #111;
        }

        .portrait-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .bar-container {
            background: #2b303c;
            height: 12px;
            width: 100%;
            border-radius: 6px;
            margin: 6px 0;
            overflow: hidden;
        }

        .hp-fill { background: linear-gradient(90deg, #e06c75, #ff4757); height: 100%; width: 100%; transition: width 0.3s; }
        .charge-fill { background: linear-gradient(90deg, #e5c07b, #ffa502); height: 100%; width: 0%; transition: width 0.3s; }

        .stat-line {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #dcdfe4;
        }

        #log {
            margin: 20px 0;
            height: 40px;
            font-size: 16px;
            color: #e5c07b;
            text-align: center;
            font-weight: 500;
        }

        #hand {
            display: flex;
            gap: 15px;
            justify-content: center;
            min-height: 170px;
            flex-wrap: wrap;
        }

        .card {
            background: #21252b;
            border: 2px solid #61afef;
            border-radius: 10px;
            padding: 12px;
            width: 125px;
            height: 165px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #ffd700;
            box-shadow: 0 8px 16px rgba(255, 215, 0, 0.3);
        }

        .card.ultimate {
            background: #3e2249;
            border-color: #c678dd;
            box-shadow: 0 0 10px rgba(198, 120, 221, 0.5);
        }

        .card-cost {
            font-size: 13px;
            font-weight: bold;
            color: #61afef;
        }

        .card.ultimate .card-cost { color: #e06c75; }

        .card-title {
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .card-desc {
            font-size: 11px;
            color: #abb2bf;
            line-height: 1.4;
        }

        button.end-turn {
            margin-top: 20px;
            padding: 10px 30px;
            background: linear-gradient(135deg, #98c379, #2ecc71);
            border: none;
            color: #1a1e24;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            transition: filter 0.2s;
        }

        button.end-turn:hover {
            filter: brightness(1.15);
        }
    </style>
</head>
<body>

    <h2>碧藍尖塔 (Granblue Spire)</h2>

    <div id="battlefield">
        <!-- 玩家：ハロアズサ -->
        <div class="entity" id="player">
            <div class="portrait-wrapper">
                <img src="https://img.gamewith.jp/article_tools/granbluefantasy/gacha/3678hyouka.jpg" alt="ハロアズサ">
            </div>
            <h3 style="margin: 0 0 8px 0; color: #e5c07b;">ハロアズサ (Azusa)</h3>
            
            <div class="stat-line">
                <span>生命</span>
                <span><span id="player-hp">50</span>/50</span>
            </div>
            <div class="bar-container"><div id="player-hp-bar" class="hp-fill"></div></div>

            <div class="stat-line" style="margin-top: 4px;">
                <span>奧義值</span>
                <span><span id="player-charge">0</span>%</span>
            </div>
            <div class="bar-container"><div id="player-charge-bar" class="charge-fill"></div></div>

            <div class="stat-line" style="margin-top: 6px;">
                <span>護甲: <b id="player-shield" style="color: #61afef;">0</b></span>
                <span>能量 (AP): <b id="player-ap" style="color: #98c379;">3</b>/3</span>
            </div>
        </div>

        <!-- 敵人 -->
        <div class="entity" id="enemy">
            <div class="portrait-wrapper" style="border-color: #e06c75;">
                <div style="line-height: 125px; font-size: 40px; background: #222;">🐲</div>
            </div>
            <h3 style="margin: 0 0 8px 0; color: #e06c75;">原型巴哈姆特</h3>

            <div style="font-size: 13px; color: #d19a66; margin-bottom: 6px;">
                意圖: <span id="enemy-intent" style="font-weight: bold;">攻擊 (10)</span>
            </div>

            <div class="stat-line">
                <span>生命</span>
                <span><span id="enemy-hp">80</span>/80</span>
            </div>
            <div class="bar-container"><div id="enemy-hp-bar" class="hp-fill"></div></div>

            <div class="stat-line" style="margin-top: 6px;">
                <span>護甲: <b id="enemy-shield" style="color: #61afef;">0</b></span>
            </div>
        </div>
    </div>

    <div id="log">輪到ハロアズサ的回合！選擇卡牌展開行動。</div>
    <div id="hand"></div>
    <button class="end-turn" onclick="endTurn()">結束回合</button>

    <script>
        const state = {
            player: { maxHp: 50, hp: 50, shield: 0, ap: 3, maxAp: 3, charge: 0 },
            enemy: { maxHp: 80, hp: 80, shield: 0, nextDamage: 10 },
            // ハロアズサ風格卡牌
            deck: [
                { name: "冥界之刃", cost: 1, type: "atk", value: 9, charge: 15, desc: "揮動冥刀，造成 9 傷害，+15% 奧義" },
                { name: "夜色迷蹤", cost: 1, type: "def", value: 8, charge: 10, desc: "融入夜色，獲得 8 護甲，+10% 奧義" },
                { name: "百鬼繚亂", cost: 2, type: "atk", value: 20, charge: 25, desc: "重斬群靈，造成 20 傷害，+25% 奧義" },
                { name: "幽火障壁", cost: 2, type: "def", value: 17, charge: 15, desc: "召喚幽火，獲得 17 護甲，+15% 奧義" },
            ],
            hand: []
        };

        function updateUI() {
            document.getElementById('player-hp').innerText = state.player.hp;
            document.getElementById('player-hp-bar').style.width = (state.player.hp / state.player.maxHp * 100) + '%';
            document.getElementById('player-shield').innerText = state.player.shield;
            document.getElementById('player-ap').innerText = state.player.ap;
            document.getElementById('player-charge').innerText = state.player.charge;
            document.getElementById('player-charge-bar').style.width = state.player.charge + '%';

            document.getElementById('enemy-hp').innerText = state.enemy.hp;
            document.getElementById('enemy-hp-bar').style.width = (state.enemy.hp / state.enemy.maxHp * 100) + '%';
            document.getElementById('enemy-shield').innerText = state.enemy.shield;
            document.getElementById('enemy-intent').innerText = `攻擊 (${state.enemy.nextDamage})`;

            const handContainer = document.getElementById('hand');
            handContainer.innerHTML = '';
            
            let currentCards = [...state.hand];
            if (state.player.charge >= 100) {
                currentCards.unshift({
                    name: "【奧義】冥界幽夜斬",
                    cost: 0,
                    type: "ultimate",
                    value: 40,
                    desc: "消耗 100% 奧義，釋放阿梓的全力幽夜一刀，造成 40 傷害！"
                });
            }

            currentCards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.type === 'ultimate' ? 'ultimate' : ''}`;
                cardDiv.innerHTML = `
                    <div class="card-cost">${card.cost} AP</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-desc">${card.desc}</div>
                `;
                cardDiv.onclick = () => playCard(card, index);
                handContainer.appendChild(cardDiv);
            });
        }

        function playCard(card, index) {
            if (state.player.ap < card.cost) {
                document.getElementById('log').innerText = "行動點數 (AP) 不足！";
                return;
            }

            state.player.ap -= card.cost;

            if (card.type === "atk") {
                applyDamage(state.enemy, card.value);
                state.player.charge = Math.min(100, state.player.charge + card.charge);
                document.getElementById('log').innerText = `ハロアズサ使用了【${card.name}】，造成 ${card.value} 點傷害！`;
                state.hand.splice(index, 1);
            } else if (card.type === "def") {
                state.player.shield += card.value;
                state.player.charge = Math.min(100, state.player.charge + card.charge);
                document.getElementById('log').innerText = `ハロアズサ使用了【${card.name}】，獲得 ${card.value} 點護甲！`;
                state.hand.splice(index, 1);
            } else if (card.type === "ultimate") {
                state.player.charge = 0;
                applyDamage(state.enemy, card.value);
                document.getElementById('log').innerText = `奧義釋放！【冥界幽夜斬】直接重創敵人 ${card.value} 點傷害！`;
            }

            if (state.enemy.hp <= 0) {
                alert("討伐成功！ハロアズサ擊敗了原型巴哈姆特！");
                location.reload();
                return;
            }

            updateUI();
        }

        function applyDamage(target, damage) {
            if (target.shield >= damage) {
                target.shield -= damage;
            } else {
                let rem = damage - target.shield;
                target.shield = 0;
                target.hp = Math.max(0, target.hp - rem);
            }
        }

        function drawCards(count = 4) {
            state.hand = [];
            for (let i = 0; i < count; i++) {
                const randomCard = state.deck[Math.floor(Math.random() * state.deck.length)];
                state.hand.push({ ...randomCard });
            }
        }

        function endTurn() {
            document.getElementById('log').innerText = "敵方行動中...";
            let dmg = state.enemy.nextDamage;
            applyDamage(state.player, dmg);

            if (state.player.hp <= 0) {
                alert("ハロアズサ倒下了... 爬塔結束！");
                location.reload();
                return;
            }

            state.player.ap = state.player.maxAp;
            state.player.shield = 0;
            state.enemy.shield = 0;
            state.enemy.nextDamage = Math.floor(Math.random() * 8) + 8;
            drawCards(4);
            document.getElementById('log').innerText = `敵方造成了 ${dmg} 點傷害！輪到ハロアズサ的回合。`;
            updateUI();
        }

        drawCards(4);
        updateUI();
    </script>
</body>
</html>
